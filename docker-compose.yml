version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sunat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: sunat
      MYSQL_USER: sunat_user
      MYSQL_PASSWORD: secret_user_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sunat_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "API Facturación SUNAT"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: "base64:L2aBCKzws9rg9gxqcmdO9pDMVqitW2rQuLtR+Sl8VBI="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sunat
      DB_USERNAME: sunat_user
      DB_PASSWORD: secret_user_password
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  db_data:
