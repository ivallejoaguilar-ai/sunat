[phases.setup]
nixPkgs = ["...", "php83", "php83Packages.composer"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs --no-scripts",
    "composer dump-autoload --optimize"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache"
]

[start]
cmd = "bash -c 'echo Starting Laravel...; php artisan migrate --force; echo Caching config...; php artisan config:cache; echo Caching routes...; php artisan route:cache; echo Starting server...; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'"